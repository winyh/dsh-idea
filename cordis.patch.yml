- insert:
    - id: dsh-idea
      name: dsh-idea
      config:
        defaultRoot: "."
        reportDir: ".dsh-idea/reports"
        maxFiles: 500
        maxRows: 50000
        maxFileBytes: 1048576
        maxTextChars: 180000
        maxResultChars: 50000
        defaultLanguage: "zh-CN"
        defaultSort: "verifiable"
        maxExternalUrls: 5
        maxExternalChars: 30000
        requestTimeoutMs: 30000
